services:
  - type: web
    name: francesco-crivello-pt
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://hzlfknqnwzwmljpesytx.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        value: francescopaolo.crivello96@gmail.com
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
